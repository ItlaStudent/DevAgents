<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevAgents · Órdenes</title><style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#12171c;color:#e8edf1}*{box-sizing:border-box}body{margin:0 auto;max-width:760px;padding:24px 18px 48px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #35434e;padding-bottom:20px;margin-bottom:24px}.brand{font-size:13px;font-weight:700;letter-spacing:.12em;color:#93b1c2}h1{font-size:28px;margin:8px 0}h2{font-size:20px;margin:0 0 16px}h3{font-size:16px;margin:0 0 12px}.muted{color:#a9b7c2;font-size:14px}label{display:block;margin-bottom:10px}input{width:100%;background:#1d262e;color:inherit;border:1px solid #536877;padding:12px;border-radius:6px;margin:0 0 16px;font:inherit}button{font:inherit;min-height:44px;padding:10px 14px;background:#a8d4ed;color:#11202a;border:0;border-radius:6px;cursor:pointer}button.secondary{background:#26343e;color:#dfe8ed}button.danger{background:#4a292b;color:#ffd7d8}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible{outline:2px solid #b9e7ff;outline-offset:3px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.card{border:1px solid #35434e;background:#192127;border-radius:8px;padding:18px;margin:12px 0;overflow-wrap:anywhere}.order{width:100%;display:block;text-align:left;background:#192127;color:inherit;border:1px solid #35434e;border-radius:8px;margin:12px 0;padding:18px}.status{display:block;margin-top:8px;font-size:13px;color:#a8d4ed}#notice{min-height:24px;color:#d8b988;margin-bottom:16px}.error{color:#ffb1b1!important}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px ui-monospace,monospace;background:#11181d;padding:12px;border-radius:4px}section[hidden]{display:none}@media(max-width:420px){header{align-items:flex-start}body{padding-top:18px}h1{font-size:25px}.actions button{flex:1}}
</style></head><body>
<header><div><div class="brand">DEVAGENTS</div><h1>Órdenes a distancia</h1><div class="muted">Tu motor, bajo tu control.</div></div><button id="logout" class="secondary" hidden>Salir</button></header>
<div id="notice" role="status" aria-live="polite"></div>
<section id="login"><h2>Conectar al motor</h2><p class="muted">Introduce el token que se mostró al activar el acceso remoto. Se conserva solo en esta pestaña.</p><form id="form"><label for="token">Token de acceso</label><input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required><button id="connect" type="submit">Entrar</button></form></section>
<section id="dashboard" hidden><div class="actions"><button id="refresh" class="secondary">Actualizar</button></div><h2 style="margin-top:24px">Órdenes</h2><div id="orders"></div><h2 style="margin-top:28px">Aprobaciones pendientes</h2><div id="approvals"></div></section>
<section id="detail" hidden><button id="back" data-action="back" class="secondary">Volver a órdenes</button><div id="summary" class="card"></div><div id="detail-actions" class="actions"></div><h2 style="margin-top:24px">Eventos de la orden</h2><div id="events"></div></section>
<script>
'use strict';
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('devagents.remote.token')||'',selected=0,lastEvent=0,busy=false;
const states={pending:'Pendiente',clarifying:'Necesita aclaración',approved:'Plan aprobado',rejected:'Rechazada',awaiting_best_of_n:'Esperando candidata',planned:'Plan preparado',planning:'Planificando',awaiting_approval:'Esperando aprobación',done:'Terminada',failed:'Fallida',audit_unavailable:'Sin auditar',cancelled:'Cancelada',running:'En ejecución',interrupted:'Interrumpida'};
function note(message,error=false){$('notice').textContent=message;$('notice').classList.toggle('error',error)}
function node(tag,text,cls){const el=document.createElement(tag);el.textContent=text;if(cls)el.className=cls;return el}
function exit(){token='';sessionStorage.removeItem('devagents.remote.token');$('token').value='';$('login').hidden=false;$('dashboard').hidden=true;$('detail').hidden=true;$('logout').hidden=true;selected=0}
async function api(path,body){const response=await fetch(path,{method:body===undefined?'GET':'POST',headers:{Authorization:['Bearer',token].join(' '),...(body===undefined?{}:{'Content-Type':'application/json'})},...(body===undefined?{}:{body:JSON.stringify(body)}),credentials:'omit',cache:'no-store'});if(response.status===401){exit();throw Error('Token inválido. Vuelve a conectar.')}const data=await response.json();if(!response.ok)throw Error(data.error||('Error del motor ('+response.status+')'));return data}
function action(label,handler,cls){const button=node('button',label,cls);if(label==='Cancelar orden')button.dataset.action='cancel';button.onclick=()=>guard(handler);return button}
async function guard(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){note(e.message,true)}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function load(){const [orders,approvals]=await Promise.all([api('/api/orders'),api('/api/approvals')]);$('orders').replaceChildren();for(const order of orders){const button=action('#'+order.id+' · '+order.title,()=>show(order.id),'order');button.dataset.orderId=order.id;button.append(node('span',states[order.status_text]||order.status_text,'status'));$('orders').append(button)}if(!orders.length)$('orders').append(node('p','No hay órdenes.','muted'));$('approvals').replaceChildren();for(const approval of approvals){const card=node('div','','card');card.dataset.approvalId=approval.id;card.append(node('h3','Orden #'+approval.order_id),node('p',approval.description||approval.command_prefix||'Aprobación requerida'));const actions=node('div','','actions');const yes=action('Aprobar',()=>resolve(approval.id,true)),no=action('Denegar',()=>resolve(approval.id,false),'danger');yes.dataset.approve='';no.dataset.deny='';actions.append(yes,no);card.append(actions);$('approvals').append(card)}if(!approvals.length)$('approvals').append(node('p','No hay aprobaciones pendientes.','muted'));$('login').hidden=true;$('dashboard').hidden=false;$('detail').hidden=true;$('logout').hidden=false;note('Conectado al motor.');}
async function resolve(id,approved){await api('/api/approvals/'+id,{approved});await load();note(approved?'Aprobación enviada.':'Aprobación denegada.');}
async function show(id){selected=id;lastEvent=0;const data=await api('/api/orders/'+id);$('summary').replaceChildren(node('h2','Orden #'+id),node('p',data.title||data.text||''),node('p',states[data.status_text]||data.status_text,'status'));$('detail-actions').replaceChildren(action('Actualizar eventos',events,'secondary'));if(data.status_text==='planned')$('detail-actions').append(action('Aprobar plan',async()=>{await api('/api/orders/'+id+'/approve',{});await show(id)}));if(['awaiting_approval','running'].includes(data.status_text))$('detail-actions').append(action('Cancelar orden',async()=>{if(!confirm('¿Cancelar esta orden?'))return;await api('/api/orders/'+id+'/cancel',{});await show(id);note('Orden cancelada.');},'danger'));$('events').replaceChildren();$('dashboard').hidden=true;$('detail').hidden=false;await events();}
async function events(){const data=await api('/api/orders/'+selected+'/events?since='+lastEvent);for(const event of data){lastEvent=Math.max(lastEvent,event.id||0);const card=node('div','','card');card.append(node('h3',event.kind||event.type||'Evento'),node('pre',typeof event.payload==='string'?event.payload:JSON.stringify(event.payload||event)));$('events').append(card)}if(!$('events').children.length)$('events').append(node('p','Sin eventos todavía.','muted'));}
$('form').onsubmit=e=>{e.preventDefault();guard(async()=>{token=$('token').value.trim();await load();sessionStorage.setItem('devagents.remote.token',token);$('token').value='';})};$('refresh').onclick=()=>guard(load);$('back').onclick=()=>guard(load);$('logout').onclick=()=>{exit();note('Sesión cerrada.');};if(token)guard(load);
</script></body></html>
